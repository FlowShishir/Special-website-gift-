<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08030c">
<title>Junnu ❤️ — Under Work</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700&family=Pacifico&display=swap");
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;justify-content:center;align-items:center;text-align:center;color:#fff;font-family:"Baloo Da 2",sans-serif;background:radial-gradient(circle at 50% 22%,#ff318c2b,transparent 30%),radial-gradient(circle at 10% 85%,#6748ff20,transparent 30%),linear-gradient(145deg,#190517,#08030c 55%,#020106)}
body:before{content:"";position:fixed;inset:-30%;background:conic-gradient(transparent,#ff3d9418,transparent 25%,#784bff12,transparent 55%);filter:blur(45px);animation:spin 18s linear infinite}
.wrap{width:min(560px,92vw);position:relative;z-index:2;padding:18px 0}
.warning{font-size:52px;color:#ff82c2;text-shadow:0 0 15px #ff3b99,0 0 35px #ff197d66;animation:pulse 1.8s infinite}
.top,.under{font-family:Georgia,serif;letter-spacing:4px;text-transform:uppercase}.top{font-size:12px}.under{font-size:14px;color:#ff75b7}
.junnu{font-family:Pacifico,cursive;font-size:clamp(75px,22vw,132px);line-height:1;margin:8px 0 20px;color:#ff75b7;text-shadow:0 0 5px #fff,0 0 18px #ff4da4,0 0 42px #ff197d88;animation:glow 2.7s infinite;position:relative}
.crown{position:absolute;font-family:Arial;font-size:34px;right:3%;top:0}
.panel{position:relative;border:1px solid #ff5eae88;border-radius:25px;padding:28px 18px 24px;background:#ffffff09;box-shadow:0 0 35px #ff258226,inset 0 0 30px #ff4c9d0c;backdrop-filter:blur(12px);animation:in .8s both}
.gear{position:absolute;top:-23px;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#150817;border:1px solid #ff63ae;color:#ff78ba;font-size:27px;box-shadow:0 0 24px #ff2d8b66;animation:gear 5s linear infinite}
.main{font-size:clamp(25px,7vw,38px);font-weight:700;line-height:1.15}.sub{font-size:clamp(19px,5vw,27px);color:#ff8fc4;line-height:1.3}
.divider{height:1px;margin:18px 5%;background:linear-gradient(90deg,transparent,#ff5eae,transparent)}
.week{font-size:20px;font-weight:700;color:#ff8fc5}.calendar{display:inline-grid;place-items:center;width:43px;height:43px;margin-right:10px;border-radius:10px;background:#fff;color:#ff3e8f;box-shadow:0 0 18px #ff4da655}.reason{font-size:18px;color:#eee0ea}
.loader{margin:28px auto 4px;height:70px;position:relative;width:90%;display:grid;place-items:center;overflow:visible}.heart{font-size:66px;color:#ff67b0;background:transparent;padding:0 12px;z-index:2;filter:drop-shadow(0 0 7px #ffb4dc) drop-shadow(0 0 18px #ff2d8b) drop-shadow(0 0 35px #ff2d8b77);animation:beat 1.15s infinite}
svg{position:absolute;width:100%;height:48px;z-index:1}path{fill:none;stroke:#ff54a4;stroke-width:2;stroke-dasharray:650;stroke-dashoffset:650;filter:drop-shadow(0 0 5px #ff2d8b);animation:ecg 2.2s linear infinite}
.loading{font-family:Georgia,serif;letter-spacing:4px;color:#ff92c6;font-size:14px}.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3d92;margin:8px 3px;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}.dots i:nth-child(4){animation-delay:.45s}.dots i:nth-child(5){animation-delay:.6s}
.thanks{font-family:Pacifico,cursive;color:#ff78b9;font-size:23px;margin-top:18px}.coming{font-family:Georgia,serif;letter-spacing:3px;color:#efb9d5;font-size:12px;margin-top:8px;text-transform:uppercase}.stay{display:inline-block;margin-top:18px;padding:10px 20px;border:1px solid #ff56a8;border-radius:999px;color:#fff;box-shadow:0 0 20px #ff258222}
.p{position:fixed;width:3px;height:3px;border-radius:50%;background:#ff83c2;box-shadow:0 0 10px #ff4ca6;animation:float var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes glow{50%{text-shadow:0 0 8px #fff,0 0 25px #ff4da4,0 0 55px #ff197daa}}@keyframes gear{to{transform:translateX(-50%) rotate(360deg)}}@keyframes in{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}@keyframes beat{14%{transform:scale(1.12)}28%{transform:scale(1)}50%{transform:scale(1)}}@keyframes ecg{to{stroke-dashoffset:0}}@keyframes dot{35%{transform:scale(1.3);opacity:1}70%,100%{transform:scale(.6);opacity:.4}}@keyframes float{0%{transform:translateY(105vh);opacity:0}12%{opacity:.8}100%{transform:translateY(-10vh) translateX(70px);opacity:0}}
@media(max-height:700px){.wrap{padding:5px}.warning{font-size:40px}.junnu{font-size:78px;margin-bottom:12px}.panel{padding:22px 14px}.loader{margin-top:18px}.thanks{margin-top:10px}}
</style>
</head>
<body>
<div id="particles"></div>
<main class="wrap">
<div class="warning">⚠</div>
<div class="top">SORRY, THIS PAGE IS</div><div class="under">UNDER WORK</div>
<div class="junnu">Junnu <span class="crown">♕</span></div>
<section class="panel">
<div class="gear">⚙</div>
<div class="main">বর্তমানে ওয়েবসাইটে কাজ চলছে</div>
<div class="sub">দয়া করে কিছুদিন পরে চেষ্টা করো ❤️</div>
<div class="divider"></div>
<div class="week"><span class="calendar">♥</span>সপ্তাহে একবার হলেও চেক করো</div>
<div class="reason">কারণ প্রতি সপ্তাহে নতুন কিছু আসবে ✨</div>
</section>
<div class="loader"><svg viewBox="0 0 600 60" preserveAspectRatio="none"><path d="M0 30H145L170 30 185 30 200 8 220 52 238 30H285L310 30 325 30 340 12 360 50 378 30H600"/></svg><div class="heart">♡</div></div>
<div class="loading">LOADING...</div><div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
<div class="thanks">♥ Thanks For Your Patience ♥</div>
<div class="coming">Something Beautiful Is Coming Soon...</div>
<div class="stay">♥ Stay Tuned With Love ♥</div>
</main>
<script>
const box=document.getElementById("particles");
for(let i=0;i<35;i++){let p=document.createElement("span");p.className="p";p.style.left=Math.random()*100+"%";p.style.setProperty("--d",7+Math.random()*12+"s");p.style.setProperty("--delay",-Math.random()*14+"s");box.appendChild(p)}
</script>
</body></html>
